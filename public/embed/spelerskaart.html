<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayerPath spelerskaart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/*
 * De PlayerPath-spelerskaart als losse HTML, om op je website te zetten.
 *
 * Gebruik: kopieer dit hele bestand, of alleen de <style>, de <script> en
 * een <div class="pp-kaart" data-kaart="..."></div>. De gegevens van een
 * kaart staan in het data-kaart-attribuut (JSON) - zie de voorbeelden
 * onderaan. Niets hiervan praat met PlayerPath: het zijn verzonnen kaarten
 * voor je site, geen echte kinderen.
 */
.pp-embed { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #f1f5f9; }
.pp-embed *, .pp-embed *::before, .pp-embed *::after { box-sizing: border-box; }
.pp-embed p, .pp-embed ul { margin: 0; }
.pp-embed ul { padding: 0; list-style: none; }
.pp-embed svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pp-embed .tabular { font-variant-numeric: tabular-nums; }
.pp-embed .size-3\.5 { width: .875rem; height: .875rem; }
.pp-embed .pp-kaart { display: block; }
.pp-embed .pp-rij { display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; align-items: flex-start; padding: 2rem 1rem; background: #0d0f12; }
.pp-embed .pp-rij > .pp-kaart { flex: 1 1 18rem; max-width: 22.5rem; }

/* ---------- Basis: de maten en de kleuren die elk level deelt ---------- */
.pp-wrap {
    --pp-facet: 1rem;
    --pp-rand: 0.4rem;
    --pp-surface-1: #131c30;
    --pp-surface-2: #0a0f1c;
    --pp-accent: #22e06b;
    --pp-tekst: #f1f5f9;
    --pp-tekst-zacht: #94a3b8;
    /* Per level overschreven: het metaal van het frame, de tint en de gloed. */
    --pp-tier: #94a3b8;
    --pp-tier-zacht: rgba(148, 163, 184, 0.18);
    --pp-gloed: rgba(148, 163, 184, 0.25);
    --pp-metaal: linear-gradient(135deg, #cfd6de 0%, #8c96a3 20%, #4b5563 38%, #d9dfe6 52%, #7b8592 68%, #3f4650 84%, #b5bdc7 100%);

    width: 100%;
    max-width: 22.5rem;
    margin-inline: auto;
    color: var(--pp-tekst);
    font-variant-numeric: tabular-nums;
}

/*
 * Het frame: metaal met facet-hoeken. De hoeken komen van een clip-path, en
 * omdat die ook de schaduw wegknipt zit de gloed als drop-shadow op de wrap.
 */
.pp-frame {
    position: relative;
    padding: var(--pp-rand);
    background: var(--pp-metaal);
    clip-path: polygon(
        var(--pp-facet) 0,
        calc(100% - var(--pp-facet)) 0,
        100% var(--pp-facet),
        100% calc(100% - var(--pp-facet)),
        calc(100% - var(--pp-facet)) 100%,
        var(--pp-facet) 100%,
        0 calc(100% - var(--pp-facet)),
        0 var(--pp-facet)
    );
    filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 22px var(--pp-gloed));
    /* Kantelen (muis of gyroscoop) en omdraaien zitten in dezelfde transform. */
    transform: perspective(900px) rotateX(var(--pp-rx, 0deg)) rotateY(calc(var(--pp-ry, 0deg) + var(--pp-flip, 0deg)));
    transition: transform 0.28s ease;
    will-change: transform;
}

.pp-geen-overgang {
    transition: none;
}

/* De lichtval die met het kantelen meeloopt over het metaal. */
.pp-frame-licht {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: var(--pp-licht, 0);
    background: radial-gradient(45% 45% at var(--pp-gx, 30%) var(--pp-gy, 20%), rgba(255, 255, 255, 0.45), transparent 70%);
    mix-blend-mode: soft-light;
    transition: opacity 0.4s ease;
}

/* Het rugnummer: groot en in het metaal van het level, linksonder op de foto
   (rechts staan de mijlpalen). */
.pp-rugnummer {
    position: absolute;
    left: 0.9rem;
    bottom: 0.35rem;
    z-index: 2;
    font-size: 2.6rem;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--pp-tier);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
}

/* ---------- De achterkant ---------- */
.pp-achter-inhoud {
    position: relative;
    padding: 1rem 1.1rem 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
}

.pp-achter-naam {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: -0.01em;
}

.pp-achter-kop {
    margin-top: 0.6rem;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--pp-tier);
}

.pp-rapporten {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
}

.pp-rapport {
    padding: 0.5rem 0.65rem;
    border-radius: 0.6rem;
    background: rgba(255, 255, 255, 0.05);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
}

.pp-rapport-regel {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    font-size: 0.8rem;
}

.pp-rapport-trainer {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--pp-tekst-zacht);
}

.pp-rapport-cijfer {
    margin-left: auto;
    font-size: 1.05rem;
    font-weight: 800;
}

.pp-rapport-noot {
    margin-top: 0.2rem;
    font-size: 0.75rem;
    line-height: 1.35;
    color: var(--pp-tekst-zacht);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.pp-achter-leeg {
    font-size: 0.78rem;
    color: var(--pp-tekst-zacht);
}

.pp-doel {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    padding: 0.5rem 0.65rem;
    border-radius: 0.6rem;
    background: rgba(34, 224, 107, 0.08);
    box-shadow: inset 0 0 0 1px rgba(34, 224, 107, 0.25);
}

.pp-doel-status {
    margin-left: auto;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--pp-accent);
}

.pp-achter-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
}

.pp-achter-voet {
    margin-top: auto;
    padding-top: 0.8rem;
}

/* ---------- Het pijltje per categorie ---------- */
.pp-delta {
    margin-left: auto;
    font-size: 0.68rem;
    font-weight: 800;
    padding: 0.05rem 0.3rem;
    border-radius: 999px;
    animation: pp-delta-in 0.6s ease-out both;
}

.pp-delta-op {
    color: #22e06b;
    background: rgba(34, 224, 107, 0.14);
}

.pp-delta-af {
    color: #f59e0b;
    background: rgba(245, 158, 11, 0.14);
}

@keyframes pp-delta-in {
    from {
        opacity: 0;
        transform: translateY(4px);
    }
    to {
        opacity: 1;
        transform: none;
    }
}

/* De glans over het metaal: een lichtval linksboven en een diagonale streep. */
.pp-frame-glans {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, 0.55) 44%, rgba(255, 255, 255, 0.1) 50%, transparent 58%),
        radial-gradient(70% 40% at 10% 0%, rgba(255, 255, 255, 0.5), transparent 70%);
    mix-blend-mode: soft-light;
}

.pp-binnen {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, var(--pp-surface-1), var(--pp-surface-2));
    clip-path: polygon(
        calc(var(--pp-facet) - var(--pp-rand)) 0,
        calc(100% - var(--pp-facet) + var(--pp-rand)) 0,
        100% calc(var(--pp-facet) - var(--pp-rand)),
        100% calc(100% - var(--pp-facet) + var(--pp-rand)),
        calc(100% - var(--pp-facet) + var(--pp-rand)) 100%,
        calc(var(--pp-facet) - var(--pp-rand)) 100%,
        0 calc(100% - var(--pp-facet) + var(--pp-rand)),
        0 calc(var(--pp-facet) - var(--pp-rand))
    );
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
}

/* ---------- De foto ---------- */
.pp-foto-vak {
    position: relative;
    aspect-ratio: 3 / 2;
    background: radial-gradient(80% 60% at 50% 30%, var(--pp-tier-zacht), transparent 70%), var(--pp-surface-1);
}

.pp-foto {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
}

/* Zonder foto: een net silhouet, en voor wie het mag een knop. */
.pp-silhouet {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 0.5rem;
    height: 100%;
    padding-bottom: 2.75rem;
}

.pp-silhouet-icoon {
    width: 5.5rem;
    height: 5.5rem;
    color: var(--pp-tier);
    opacity: 0.35;
}

.pp-foto-knop {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.4rem 0.8rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--pp-tekst);
    background: rgba(255, 255, 255, 0.1);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
}

.pp-foto-knop:hover {
    background: rgba(255, 255, 255, 0.18);
}

/* Boven donkerder voor het cijfer, onder een fade naar het vlak eronder. */
.pp-foto-fade {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(5, 8, 16, 0.55) 0%, transparent 40%), linear-gradient(180deg, transparent 50%, var(--pp-surface-1) 100%);
}

.pp-merk {
    position: absolute;
    top: 0.55rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.5625rem;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--pp-tier);
    opacity: 0.9;
}

.pp-overall-blok {
    position: absolute;
    top: 1.5rem;
    left: 1rem;
    line-height: 1;
}

.pp-overall {
    font-size: 3.75rem;
    font-weight: 800;
    letter-spacing: -0.05em;
    line-height: 0.9;
    color: var(--pp-accent);
    text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.6),
        0 0 28px rgba(34, 224, 107, 0.35);
}

.pp-positie {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    margin-top: 0.4rem;
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--pp-tier);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
}

.pp-categorie {
    margin-top: 0.3rem;
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--pp-tekst);
    opacity: 0.85;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
}

/* Drie badges rechtsboven: rond icoon in de tint van het level, label eronder. */
.pp-badges {
    position: absolute;
    top: 1.5rem;
    right: 0.85rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin: 0;
    padding: 0;
    list-style: none;
}

.pp-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
    width: 3.75rem;
}

.pp-badge-icoon {
    display: grid;
    place-items: center;
    width: 1.9rem;
    height: 1.9rem;
    border-radius: 999px;
    color: var(--pp-surface-2);
    background: var(--pp-metaal);
    box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.35) inset,
        0 4px 10px rgba(0, 0, 0, 0.5);
}

.pp-badge-label {
    max-width: 100%;
    line-height: 1.15;
    font-size: 0.5625rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-align: center;
    color: var(--pp-tekst);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
}

/* ---------- Het onderste deel ---------- */
.pp-body {
    position: relative;
    padding: 0 1rem 0.9rem;
}

/* Keepers: diagonale handschoen-strepen. Veldspelers: veldlijnen. Subtiel. */
.pp-patroon {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
}

.pp-keeper .pp-patroon {
    background: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0 2px, transparent 2px 18px);
}

.pp-field .pp-patroon {
    background:
        radial-gradient(circle at 50% 30%, transparent 22%, rgba(255, 255, 255, 0.05) 22.5%, transparent 23.5%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.02) 0 1px, transparent 1px 44px);
}

.pp-naam {
    position: relative;
    margin-top: -0.25rem;
    text-align: center;
    line-height: 1.05;
}

.pp-voornaam {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--pp-tekst-zacht);
}

.pp-achternaam {
    margin-top: 0.15rem;
    font-size: 1.625rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
}

.pp-stats {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem 1.1rem;
    margin-top: 0.85rem;
}

.pp-stat-regel {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem;
}

.pp-stat-label {
    min-width: 0;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--pp-tekst-zacht);
}

.pp-stat-cijfer {
    font-size: 1.0625rem;
    font-weight: 800;
    line-height: 1;
}

.pp-balk {
    height: 0.2rem;
    margin-top: 0.3rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.09);
    overflow: hidden;
}

.pp-balk-vulling {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--pp-accent), var(--pp-tier));
    transition: width 0.6s ease;
}

.pp-leeg {
    position: relative;
    margin: 1rem auto 0;
    max-width: 15rem;
    text-align: center;
    font-size: 0.8125rem;
    color: var(--pp-tekst-zacht);
}

/* De XP-balk: het stimuleringsdeel, in de tint van het level. */
.pp-xp {
    position: relative;
    margin-top: 0.9rem;
    padding-top: 0.7rem;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.pp-xp-regel {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
}

.pp-xp-label {
    font-size: 0.625rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--pp-tier);
}

.pp-xp-cijfer {
    font-size: 0.8125rem;
    font-weight: 700;
    color: var(--pp-tier);
}

.pp-balk-xp {
    height: 0.3rem;
    background: rgba(255, 255, 255, 0.1);
}

.pp-balk-xp .pp-balk-vulling {
    background: var(--pp-metaal);
}

.pp-xp-tekst {
    margin-top: 0.35rem;
    font-size: 0.75rem;
    color: var(--pp-tekst-zacht);
}

.pp-voet {
    position: relative;
    margin-top: 0.75rem;
    text-align: center;
    line-height: 1.3;
}

.pp-voet-regel {
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--pp-tier);
}

.pp-school {
    font-size: 0.625rem;
    color: var(--pp-tekst-zacht);
}

/* ---------- Onder de kaart ---------- */
.pp-acties {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 1rem;
}

.pp-actie {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    min-height: 2.75rem;
    padding: 0.5rem 1rem;
    border-radius: 999px;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--pp-tekst);
    background: rgba(255, 255, 255, 0.06);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    transition: background 0.15s ease;
}

.pp-actie:hover {
    background: rgba(255, 255, 255, 0.12);
}

/*
 * De upgrade-flits: een korte lichtstoot over het nieuwe frame.
 *
 * Een eigen laag en niet de filter van .pp-frame, want daar zit al de gloed op
 * en bij elite ook de holografische animatie; die zouden elkaar overschrijven.
 */
.pp-flits {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(60% 50% at 50% 45%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.35) 45%, transparent 72%);
    animation: pp-flits 1.1s ease-out forwards;
}

@keyframes pp-flits {
    0% {
        opacity: 0;
    }
    18% {
        opacity: 1;
    }
    100% {
        opacity: 0;
    }
}

.pp-puls {
    animation: pp-puls 0.9s ease-out;
}

@keyframes pp-puls {
    0% {
        transform: scale(1);
    }
    30% {
        transform: scale(1.035);
    }
    100% {
        transform: scale(1);
    }
}

@media (prefers-reduced-motion: reduce) {
    .pp-frame {
        transition: none;
        transform: none;
    }

    .pp-delta {
        animation: none;
    }

    .pp-flits,
    .pp-puls {
        animation: none;
    }

    .pp-flits {
        opacity: 0;
    }
}

/* ---------- Levels: het metaal van het frame ---------- */

/* Brons: koper. Warm, met een donkere schaduwzijde. */
.pp-tier-brons {
    --pp-tier: #e0a370;
    --pp-tier-zacht: rgba(214, 154, 91, 0.2);
    --pp-gloed: rgba(214, 140, 80, 0.3);
    --pp-metaal: linear-gradient(135deg, #f2b98a 0%, #b5651d 18%, #6b3a12 36%, #f0c39a 50%, #a9581a 66%, #5a2f0e 82%, #d98a4b 100%);
}

/* Zilver: chroom. Koel, hard licht, bijna wit in de spiegeling. */
.pp-tier-zilver {
    --pp-tier: #e2e9f0;
    --pp-tier-zacht: rgba(219, 228, 238, 0.18);
    --pp-gloed: rgba(219, 228, 238, 0.32);
    --pp-metaal: linear-gradient(135deg, #ffffff 0%, #b9c3ce 18%, #5b6672 36%, #f4f7fa 50%, #9aa6b3 66%, #4a535d 82%, #dfe6ec 100%);
}

/* Goud: warm, met een gloed die net buiten het frame valt. */
.pp-tier-goud {
    --pp-tier: #f0cf6c;
    --pp-tier-zacht: rgba(232, 199, 102, 0.22);
    --pp-gloed: rgba(240, 200, 90, 0.5);
    --pp-surface-1: #172038;
    --pp-metaal: linear-gradient(135deg, #fbe28a 0%, #d4a72c 18%, #8a5c0a 36%, #fff0b3 50%, #c9961c 66%, #6e4a06 82%, #ecc95c 100%);
}

/* Elite: holografisch. Het enige frame dat beweegt, langzaam. */
.pp-tier-elite {
    --pp-tier: #f3e2a2;
    --pp-tier-zacht: rgba(200, 190, 255, 0.22);
    --pp-gloed: rgba(190, 170, 255, 0.45);
    --pp-surface-1: #171432;
    --pp-surface-2: #07070f;
    /* Pasteltinten afgewisseld met donkere facetten; zonder die donkere stops
       leest het als een sticker in plaats van als metaal. */
    --pp-metaal: linear-gradient(
        120deg,
        #e9e6ff 0%,
        #8fd3ff 11%,
        #4f4a9c 21%,
        #c8a2ff 32%,
        #ffb3e6 43%,
        #6b3f7c 53%,
        #fff2a8 63%,
        #a8ffd8 74%,
        #3f6b96 85%,
        #e9e6ff 100%
    );
}

.pp-tier-elite .pp-frame {
    background-size: 300% 300%;
    animation: pp-holo 9s ease-in-out infinite;
}

@keyframes pp-holo {
    0%,
    100% {
        background-position: 0% 50%;
    }
    50% {
        background-position: 100% 50%;
    }
}

@media (prefers-reduced-motion: reduce) {
    .pp-tier-elite .pp-frame {
        animation: none;
    }
}

/* ---------- Kleine schermen ---------- */
@media (max-width: 360px) {
    .pp-overall {
        font-size: 3.125rem;
    }

    .pp-achternaam {
        font-size: 1.375rem;
    }
}

</style>
</head>
<body style="margin:0;background:#0d0f12">

<div class="pp-embed">
  <div class="pp-rij">
    <!-- Drie voorbeeldkaarten. Pas de JSON aan of haal er kaarten weg. -->
    <div class="pp-kaart" data-kaart='{
      "first_name": "Sem", "last_name": "de Vries", "position": "keeper", "age_category": "O10",
      "overall": 79, "level": "goud", "xp": 420, "progress": 4, "shirt_number": 1,
      "season": "2026/27", "school": "Voetbalschool PlayerPath", "card_number": "#0001",

</div>

<script>
(function () {
  var ICONS = {"trending": "<polyline points=\"22 7 13.5 15.5 8.5 10.5 2 17\"/><polyline points=\"16 7 22 7 22 13\"/>", "star": "<polygon points=\"12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2\"/>", "trophy": "<path d=\"M6 9H4.5a2.5 2.5 0 0 1 0-5H6\"/><path d=\"M18 9h1.5a2.5 2.5 0 0 0 0-5H18\"/><path d=\"M4 22h16\"/><path d=\"M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22\"/><path d=\"M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22\"/><path d=\"M18 2H6v7a6 6 0 0 0 12 0V2Z\"/>", "hand": "<path d=\"M18 11V6a2 2 0 0 0-4 0v1\"/><path d=\"M14 10V4a2 2 0 0 0-4 0v2\"/><path d=\"M10 10.5V6a2 2 0 0 0-4 0v8\"/><path d=\"M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15\"/>", "shirt": "<path d=\"M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z\"/>", "user": "<circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/>", "check": "<path d=\"M20 6 9 17l-5-5\"/>"};
  var LEVELS = { brons: "Brons", zilver: "Zilver", goud: "Goud", elite: "Elite", geen: "" };
  var NEXT = { brons: 150, zilver: 400, goud: 900 };

  function icon(name) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS.trophy) + '</svg>';
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function render(el, k) {
    var tier = k.overall == null ? 'geen' : (k.level || 'brons');
    var cats = (k.categories || []).map(function (c) {
      var label = c[0], rating = c[1], delta = c[2] || 0;
      return '<div class="pp-stat"><div class="pp-stat-regel"><span class="pp-stat-label">' + esc(label) + '</span>' +
        (delta ? '<span class="pp-delta tabular ' + (delta > 0 ? 'pp-delta-op' : 'pp-delta-af') + '">' + (delta > 0 ? '▲' + delta : '▼' + Math.abs(delta)) + '</span>' : '') +
        '<span class="pp-stat-cijfer tabular">' + (rating == null ? '-' : rating) + '</span></div>' +
        '<div class="pp-balk"><div class="pp-balk-vulling" style="width:' + (rating || 0) + '%"></div></div></div>';
    }).join('');
    var badges = (k.badges || []).slice(0, 3).map(function (b) {
      return '<li class="pp-badge"><span class="pp-badge-icoon">' + icon(b[0]) + '</span><span class="pp-badge-label">' + esc(b[1]) + '</span></li>';
    }).join('');
    var next = NEXT[tier];
    var xpTekst = k.overall == null ? 'Je eerste rapport zet de kaart aan' : (next ? 'Nog ' + Math.max(0, next - (k.xp || 0)) + ' punten tot je volgende upgrade' : 'Het hoogste level bereikt');

    el.className = 'pp-kaart pp-wrap pp-tier-' + tier + ' pp-' + (k.position === 'keeper' ? 'keeper' : 'field');
    el.innerHTML =
      '<div class="pp-frame"><div class="pp-frame-glans" aria-hidden="true"></div><div class="pp-frame-licht" aria-hidden="true"></div>' +
      '<div class="pp-binnen"><div class="pp-foto-vak">' +
      (k.photo ? '<img src="' + esc(k.photo) + '" alt="" class="pp-foto">' : '<div class="pp-silhouet"><span class="pp-silhouet-icoon">' + icon('user') + '</span></div>') +
      '<div class="pp-foto-fade" aria-hidden="true"></div><p class="pp-merk">PlayerPath</p>' +
      '<div class="pp-overall-blok"><p class="pp-overall tabular">' + (k.overall == null ? '-' : k.overall) + '</p>' +
      '<p class="pp-positie">' + icon(k.position === 'keeper' ? 'hand' : 'shirt') + (k.position === 'keeper' ? 'Keeper' : 'Veldspeler') + '</p>' +
      (k.age_category ? '<p class="pp-categorie">' + esc(k.age_category) + '</p>' : '') + '</div>' +
      (k.shirt_number ? '<p class="pp-rugnummer tabular">' + esc(k.shirt_number) + '</p>' : '') +
      (badges ? '<ul class="pp-badges">' + badges + '</ul>' : '') +
      '</div><div class="pp-body"><div class="pp-patroon" aria-hidden="true"></div>' +
      '<div class="pp-naam"><p class="pp-voornaam">' + esc(k.first_name || '') + '</p><p class="pp-achternaam">' + esc(k.last_name || '') + '</p></div>' +
      (k.overall == null ? '<p class="pp-leeg">Zodra het eerste rapport binnen is, komt deze kaart tot leven.</p>' : '<div class="pp-stats">' + cats + '</div>') +
      '<div class="pp-xp"><div class="pp-xp-regel"><span class="pp-xp-label">XP</span><span class="pp-xp-cijfer tabular">' + (k.xp || 0) + '</span></div>' +
      '<div class="pp-balk pp-balk-xp"><div class="pp-balk-vulling" style="width:' + (k.progress || 0) + '%"></div></div><p class="pp-xp-tekst">' + xpTekst + '</p></div>' +
      '<div class="pp-voet"><p class="pp-voet-regel">Seizoen ' + esc(k.season || '') + (k.overall != null && LEVELS[tier] ? ' · Level ' + LEVELS[tier] : '') + '</p>' +
      ((k.school || k.card_number) ? '<p class="pp-school">' + esc(k.school || '') + (k.school && k.card_number ? ' · ' : '') + '<span class="tabular">' + esc(k.card_number || '') + '</span></p>' : '') +
      '</div></div></div></div>';

    // Kantelen met de muis, met een lichtval die meeloopt.
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    el.addEventListener('pointermove', function (e) {
      if (e.pointerType !== 'mouse') return;
      var r = el.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      el.style.setProperty('--pp-ry', ((px - 0.5) * 14).toFixed(2) + 'deg');
      el.style.setProperty('--pp-rx', (-(py - 0.5) * 12).toFixed(2) + 'deg');
      el.style.setProperty('--pp-gx', (px * 100).toFixed(1) + '%');
      el.style.setProperty('--pp-gy', (py * 100).toFixed(1) + '%');
      el.style.setProperty('--pp-licht', '1');
    });
    el.addEventListener('pointerleave', function () {
      el.style.setProperty('--pp-rx', '0deg'); el.style.setProperty('--pp-ry', '0deg'); el.style.setProperty('--pp-licht', '0');
    });
  }

  document.querySelectorAll('.pp-kaart[data-kaart]').forEach(function (el) {
    try { render(el, JSON.parse(el.getAttribute('data-kaart'))); } catch (e) { el.textContent = 'Kaart: ongeldige gegevens'; }
  });
})();
</script>
